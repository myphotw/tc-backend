x-app-base: &app-base
  build:
    context: .
    network: host

  env_file:
    - .env

  environment:
    POSTGRES_HOST: 127.0.0.1
    POSTGRES_PORT: "15432"

    PHOTO_PLATFORM_ROOT: /data/PhotoPlatform
    INCOMING_DIR: /data/PhotoPlatform/incoming
    ORIGINAL_DIR: /data/PhotoPlatform/original
    PREVIEW_DIR: /data/PhotoPlatform/preview
    THUMB_DIR: /data/PhotoPlatform/thumb
    EXPORT_DIR: /data/PhotoPlatform/export
    CACHE_DIR: /data/PhotoPlatform/cache
    TEMP_DIR: /data/PhotoPlatform/temp

    GOOGLE_VISION_CREDENTIAL: /run/secrets/google-vision-service-account.json

  volumes:
    - "${PHOTO_PLATFORM_HOST_PATH}:/data/PhotoPlatform"
    - "${GOOGLE_VISION_CREDENTIAL_HOST}:/run/secrets/google-vision-service-account.json:ro"

  network_mode: host
  restart: unless-stopped


services:

  backend:
    <<: *app-base

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 10


  upload-worker:
    <<: *app-base

    command:
      - python
      - -m
      - worker.background_worker

    depends_on:
      backend:
        condition: service_healthy

  vision-worker:
    <<: *app-base
    profiles: ["vision"]

    command:
      - python
      - -m
      - worker.vision_worker

    depends_on:
      backend:
        condition: service_healthy

  plate-solve-worker:
    <<: *app-base
    profiles: ["astro"]
    command:
      - python
      - -m
      - worker.plate_solve_worker

    depends_on:
      backend:
        condition: service_healthy
