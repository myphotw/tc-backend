[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Database credentials intentionally do not belong in this file. Online
# commands receive a connection from scripts/db_migrate.py. Offline SQL uses a
# credential-free PostgreSQL dialect URL in migrations/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
